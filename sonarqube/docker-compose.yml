# Local SonarQube Community for trying the quality gate. Not for production use.
# Start:  docker compose up -d   then open http://localhost:9000 (first login admin/admin, you are asked to change it).
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
volumes:
  sonar_data:
  sonar_logs:
  sonar_extensions:
