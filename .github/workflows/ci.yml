name: ci

on:
  push:
    branches: [main, develop, "release/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp -f app/pom.xml verify

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install cfn-lint checkov
      - name: cfn-lint
        run: cfn-lint cloudformation/*.yml
      - name: checkov (policy checks)
        run: checkov -d cloudformation --framework cloudformation --compact --quiet
        env:
          CKV_NO_PLATFORM: "true"
