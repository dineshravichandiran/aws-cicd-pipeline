version: 0.2

# Runs only after the manual approval on the prod pipeline: re-tags the approved image, no rebuild.
phases:
  build:
    commands:
      - export IMAGE_TAG="$(jq -r .imageTag image.json)"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPO_URI%%/*}"
      - docker pull "$ECR_REPO_URI:$IMAGE_TAG"
      - docker tag "$ECR_REPO_URI:$IMAGE_TAG" "$ECR_REPO_URI:release-${IMAGE_TAG#*-}"
      - docker push "$ECR_REPO_URI:release-${IMAGE_TAG#*-}"
